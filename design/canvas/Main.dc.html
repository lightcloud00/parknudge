<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #B44405; } a:hover { color: #8A3404; }
    .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  </style>
</helmet>

<div style="width: 393px; height: 852px; box-sizing: border-box; background: #FFFFFF; color: #000000; display: flex; flex-direction: column; overflow: hidden;">

  <!-- status bar space intentionally left empty: the device draws its own -->
  <div style="height: 59px; flex-shrink: 0;"></div>

  <!-- NAV BAR -->
  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 16px 8px 20px; flex-shrink: 0;">
    <div style="font-size: 34px; font-weight: 700; letter-spacing: -0.02em;">ParkNudge</div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#EE6605"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg>
    </div>
  </div>

  <!-- SCROLL CONTENT -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 6px 16px 16px 16px; overflow: hidden;">

    <!-- METER HERO -->
    <div style="background: #031738; border-radius: 20px; padding: 18px 18px 16px 18px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 7px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FDAE11" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9.5V13l2.4 1.6"/><path d="M9 2.6h6"/></svg>
          <span style="font-size: 13px; font-weight: 600; color: #A8BBD8; letter-spacing: 0.01em;">Meter time remaining</span>
        </div>
        <span class="mono" style="font-size: 13px; color: #A8BBD8;">until 4:15 PM</span>
      </div>

      <div class="mono" style="font-size: 52px; font-weight: 600; color: #FFFFFF; letter-spacing: -0.025em; line-height: 1.02;">1:47:12</div>

      <div style="height: 5px; border-radius: 3px; background: #16305C; overflow: hidden; margin-top: 2px;">
        <div style="width: 38%; height: 100%; border-radius: 3px; background: #FDAE11;"></div>
      </div>
    </div>

    <!-- MAP -->
    <div style="height: 176px; border-radius: 20px; background: #E8E5DE; position: relative; overflow: hidden; flex-shrink: 0;">
      <div style="position: absolute; inset: 0;">
        <svg width="361" height="176" viewBox="0 0 361 176" style="display: block;">
          <rect width="361" height="176" fill="#E9E6DF"/>
          <rect x="0" y="0" width="361" height="176" fill="#DCEBD8" opacity="0.5"/>
          <path d="M-10 118 H371" stroke="#FFFFFF" stroke-width="16"/>
          <path d="M-10 46 H371" stroke="#FFFFFF" stroke-width="10"/>
          <path d="M96 -10 V186" stroke="#FFFFFF" stroke-width="13"/>
          <path d="M248 -10 V186" stroke="#FFFFFF" stroke-width="9"/>
          <path d="M-10 118 H371" stroke="#EFEDE7" stroke-width="1"/>
          <rect x="112" y="58" width="52" height="44" rx="3" fill="#E0DDD5"/>
          <rect x="180" y="56" width="44" height="48" rx="3" fill="#E0DDD5"/>
          <rect x="264" y="60" width="60" height="42" rx="3" fill="#E0DDD5"/>
          <rect x="18" y="132" width="58" height="36" rx="3" fill="#E0DDD5"/>
          <rect x="270" y="130" width="66" height="38" rx="3" fill="#E0DDD5"/>
          <text x="120" y="40" font-family="-apple-system, system-ui" font-size="9" fill="#8A8779">W 4th St</text>
          <text x="256" y="150" font-family="-apple-system, system-ui" font-size="9" fill="#8A8779">Union Sq</text>
        </svg>
      </div>
      <!-- pin -->
      <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center;">
        <div style="width: 38px; height: 38px; border-radius: 19px; background: #EE6605; border: 3px solid #FFFFFF; box-shadow: 0 2px 6px rgba(3,23,56,0.3); display: flex; align-items: center; justify-content: center;">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M5.2 11.4 6.6 7.5c.3-.9 1.1-1.5 2-1.5h6.8c.9 0 1.7.6 2 1.5l1.4 3.9v5.2c0 .5-.4.9-.9.9h-1.4c-.5 0-.9-.4-.9-.9v-.8H7.4v.8c0 .5-.4.9-.9.9H5.1c-.5 0-.9-.4-.9-.9zm2.1-.4h9.4l-1-2.8H8.3zM7.6 14.2a1 1 0 1 0 0-2 1 1 0 0 0 0 2m8.8 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/></svg>
        </div>
      </div>
    </div>

    <!-- DETAILS CARD -->
    <div style="background: #F2F2F7; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em;">Union Square Garage</div>
        <div class="mono" style="font-size: 15px; color: #6C6C70;">Parked for 1:24:07</div>
      </div>

      <div style="height: 1px; background: #DCDCE1;"></div>

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="1.7" stroke-linecap="round" style="flex-shrink: 0;"><path d="M4 20.5h16"/><path d="M6 20.5V5.2c0-.7.5-1.2 1.2-1.2h5.6c.7 0 1.2.5 1.2 1.2v15.3"/><path d="M14 20.5V10h3.8c.7 0 1.2.5 1.2 1.2v9.3"/><path d="M8.6 7.5h2.8M8.6 11h2.8M8.6 14.5h2.8"/></svg>
          <span style="font-size: 15px;">Level 3 &#183; Bay 14</span>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="1.7" stroke-linecap="round" style="flex-shrink: 0; margin-top: 2px;"><rect x="4" y="3.4" width="16" height="17.2" rx="2.2"/><path d="M7.8 8.4h8.4M7.8 12h8.4M7.8 15.6h5"/></svg>
          <span style="font-size: 15px; line-height: 1.35;">Next to the blue stairwell door</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="1.7" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="8.6"/><path d="M14.3 9.3c-.5-.7-1.4-1.1-2.3-1.1-1.3 0-2.1.7-2.1 1.7 0 2.4 4.5 1.1 4.5 3.6 0 1-.9 1.8-2.2 1.8-1 0-1.9-.4-2.4-1.2"/><path d="M12 6.6v10.8"/></svg>
          <span class="mono" style="font-size: 15px;">$8.00</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.7" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="2.6"/><path d="M12 1.8v2.6M12 19.6v2.6M22.2 12h-2.6M4.4 12H1.8"/></svg>
          <span style="font-size: 13px; color: #8E8E93;">GPS accuracy &#177;8 m</span>
        </div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div style="display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
      <div style="height: 50px; border-radius: 12px; background: #EE6605; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="#FFFFFF"><circle cx="13.2" cy="4.1" r="2.1"/><path d="M11.6 7.2c-1 .2-1.7.9-2 1.9l-1.3 4.2a1 1 0 0 0 1.9.6l.9-2.9.9 3.3-2.4 5.6a1.1 1.1 0 0 0 2 .9l2.3-5.1 1.5 4.6a1.1 1.1 0 0 0 2.1-.6l-2-6.2V9.6l1.5 2.1a1 1 0 0 0 1.6-1.2l-2.2-3c-.5-.7-1.3-1.1-2.1-1.1z"/></svg>
        <span style="font-size: 17px; font-weight: 600; color: #FFFFFF;">Walking Directions</span>
      </div>
      <div style="height: 46px; border-radius: 12px; background: #EFEFF4; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EE6605" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.8 20.2 7.5 8.4 19.3l-4.6.9.9-4.6z"/><path d="M14.4 5.9l3.7 3.7"/></svg>
        <span style="font-size: 17px; font-weight: 500; color: #EE6605;">Edit or Extend</span>
      </div>
      <div style="height: 46px; border-radius: 12px; background: #FDECEA; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M8.4 12.2l2.5 2.5 4.7-4.9"/></svg>
        <span style="font-size: 17px; font-weight: 500; color: #B3261E;">Finish</span>
      </div>
    </div>

  </div>

  <!-- TAB BAR -->
  <div style="flex-shrink: 0; border-top: 1px solid #D6D6DA; background: #F9F9F9; padding-top: 8px; padding-bottom: 26px; display: flex;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#EE6605"><circle cx="12" cy="12" r="9.4"/><path d="M9.6 17.4V6.6h3.1c2.1 0 3.4 1.2 3.4 3.2s-1.3 3.2-3.4 3.2h-1.2v4.4zm1.9-6h1c1 0 1.6-.5 1.6-1.5s-.6-1.6-1.6-1.6h-1z" fill="#F9F9F9"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #EE6605;">Park</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.7" stroke-linecap="round"><path d="M3.4 12a8.6 8.6 0 1 0 2.6-6.1"/><path d="M3.2 4.6v4.2h4.2"/><path d="M12 7.8V12l2.9 1.9"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8E8E93;">History</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.9"/><path d="M19.1 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a1.9 1.9 0 1 1-3.8 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1h-.2a1.9 1.9 0 1 1 0-3.8h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5v-.2a1.9 1.9 0 1 1 3.8 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1h.2a1.9 1.9 0 1 1 0 3.8h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8E8E93;">Settings</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
